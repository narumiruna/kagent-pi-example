# Render the three ${...} placeholders before applying. The Secret and
# WorkerPool must already exist in the kagent namespace.
apiVersion: kagent.dev/v1alpha3
kind: Harness
metadata:
  name: pi-agent
  namespace: kagent
spec:
  byo: {}
  workload:
    image: ${PI_AGENT_IMAGE}
    # Substrate does not use the image entrypoint/CMD.
    command: ["/usr/local/bin/node"]
    args: ["/app/dist/src/index.js"]
  env:
    - name: PI_DATA_DIR
      value: /data
    - name: PI_CODING_AGENT_DIR
      value: /data/agent
    - name: PI_GRPC_ADDRESS
      value: "0.0.0.0:80"
    - name: PI_HEALTH_HOST
      value: "0.0.0.0"
    - name: PI_MODEL_PROVIDER
      value: openai-codex
    - name: PI_MODEL_ID
      value: gpt-5.6-sol
    - name: PI_CODING_AGENT_SETTINGS_JSON
      value: '{"lastChangelogVersion":"0.85.1","defaultProvider":"openai-codex","defaultModel":"gpt-5.6-sol","defaultThinkingLevel":"high"}'
    - name: PI_SKILL_PATHS_JSON
      value: '["/app/skills"]'
    - name: PI_TOOLS_JSON
      value: '["read","write","edit","bash","grep","find","ls"]'
    - name: PI_EXPAND_PROMPT_TEMPLATES
      value: "1"
    - name: PI_CODING_AGENT_AUTH_JSON
      credentialRef:
        name: pi-agent-openai-codex
        key: auth.json
  substrate:
    workerPoolRef:
      name: ${PI_WORKER_POOL}
    snapshotPolicy:
      location: ${PI_SNAPSHOT_LOCATION}
  allowedAgentTemplates:
    selector:
      matchLabels:
        samples.kagent.dev/runtime: pi-agent
---
# Gives the compiler the provider destination needed for runtime egress.
# Keep this in sync with PI_MODEL_PROVIDER / PI_MODEL_ID above.
apiVersion: kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: pi-agent-model
  namespace: kagent
spec:
  # kagent calls this provider OpenAI; pi's corresponding provider ID is openai-codex.
  provider: OpenAI
  model: gpt-5.6-sol
  openAI:
    baseUrl: https://chatgpt.com/backend-api
    apiFormat: responses
---
apiVersion: kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: pi-agent
  namespace: kagent
  labels:
    samples.kagent.dev/runtime: pi-agent
spec:
  description: Pi coding agent with read, write, edit, and bash tools
  modelConfig:
    name: pi-agent-model
