# Compatibility deployment for kagent 0.10.x (kagent.dev/v1alpha2).
# The image serves A2A v0.3 JSON-RPC on port 8080 for the legacy BYO controller.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pi-agent-data
  namespace: kagent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: pi-agent
  namespace: kagent
spec:
  description: Pi coding agent with read, write, edit, and bash tools
  version: "0.1.0"
  type: BYO
  byo:
    deployment:
      image: docker.io/narumi/kagent-pi-example@sha256:e6a83ff71baaf58942f189e423cb24bc63f951286ab9bdbacf7d5aa78d9f7b97
      imagePullPolicy: IfNotPresent
      replicas: 1
      cmd: /usr/local/bin/node
      args:
        - /app/dist/src/index.js
      env:
        - name: PI_DATA_DIR
          value: /data
        - name: PI_CODING_AGENT_DIR
          value: /data/agent
        - name: PI_GRPC_ADDRESS
          value: "127.0.0.1:8082"
        - name: PI_HTTP_HOST
          value: "0.0.0.0"
        - name: PI_HTTP_PORT
          value: "8080"
        - name: PI_HEALTH_HOST
          value: "0.0.0.0"
        - name: PI_HEALTH_PORT
          value: "8081"
        - name: PI_MODEL_PROVIDER
          value: openai-codex
        - name: PI_MODEL_ID
          value: gpt-5.6-sol
        - name: PI_CODING_AGENT_SETTINGS_JSON
          value: '{"lastChangelogVersion":"0.85.1","defaultProvider":"openai-codex","defaultModel":"gpt-5.6-sol","defaultThinkingLevel":"high"}'
        - name: PI_SKILL_PATHS_JSON
          value: '["/app/skills"]'
        - name: PI_TOOLS_JSON
          value: '["read","write","edit","bash","grep","find","ls"]'
        - name: PI_EXPAND_PROMPT_TEMPLATES
          value: "1"
        - name: PI_CODING_AGENT_AUTH_JSON
          valueFrom:
            secretKeyRef:
              name: pi-agent-openai-codex
              key: auth.json
      volumeMounts:
        - name: data
          mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pi-agent-data
  sandbox:
    network:
      allowedDomains:
        - chatgpt.com
        - auth.openai.com
