# Compatibility deployment for kagent 0.10.x (kagent.dev/v1alpha2).
# The image serves A2A v0.3 JSON-RPC on port 8080 for the legacy BYO controller.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pi-agent-data
  namespace: kagent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Keep the tool-visible workspace on a filesystem separate from credentials
# and sessions so hard links cannot cross the trust boundary.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pi-agent-workspace
  namespace: kagent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# The X-User-Id header is trusted only because ingress is restricted to the
# authenticated kagent controller/gateway in this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pi-agent-private-ingress
  namespace: kagent
spec:
  podSelector:
    matchLabels:
      kagent: pi-agent
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: kagent
              app.kubernetes.io/name: kagent
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: pi-agent
  namespace: kagent
spec:
  description: Pi coding agent with read, write, edit, and bash tools
  version: "0.1.0"
  type: BYO
  byo:
    deployment:
      image: docker.io/narumi/kagent-pi-example@sha256:a52f5466e4d9f888b8b9f13f6da41af66efc84c2a62cfbc466f033678d36482d
      imagePullPolicy: IfNotPresent
      replicas: 1
      cmd: /usr/local/bin/node
      args:
        - /app/dist/src/index.js
      env:
        - name: PI_DATA_DIR
          value: /data
        - name: PI_CODING_AGENT_DIR
          value: /data/agent
        - name: PI_WORKSPACE_DIR
          value: /workspace
        - name: PI_MAX_CONCURRENCY
          value: "2"
        - name: PI_BASH_SANDBOX_SOCKET
          value: /run/pi-sandbox/sandbox.sock
        - name: PI_QUEUE_TIMEOUT_MS
          value: "30000"
        - name: PI_CONTEXT_IDLE_MS
          value: "900000"
        - name: PI_MCP_ENABLED
          value: "false"
        - name: PI_MEMORY_ENABLED
          value: "false"
        - name: PI_TRUSTED_USER_HEADER
          value: X-User-Id
        - name: PI_GRPC_ADDRESS
          value: "127.0.0.1:8082"
        - name: PI_HTTP_HOST
          value: "0.0.0.0"
        - name: PI_HTTP_PORT
          value: "8080"
        - name: PI_HEALTH_HOST
          value: "0.0.0.0"
        - name: PI_HEALTH_PORT
          value: "8081"
        - name: PI_MODEL_PROVIDER
          value: openai-codex
        - name: PI_MODEL_ID
          value: gpt-5.6-sol
        - name: PI_CODING_AGENT_SETTINGS_JSON
          value: '{"lastChangelogVersion":"0.85.1","defaultProvider":"openai-codex","defaultModel":"gpt-5.6-sol","defaultThinkingLevel":"high"}'
        - name: PI_SKILL_PATHS_JSON
          value: '["/app/skills"]'
        - name: PI_TOOLS_JSON
          value: '["read","write","edit","bash","grep","find","ls"]'
        - name: PI_EXPAND_PROMPT_TEMPLATES
          value: "1"
        - name: PI_CODING_AGENT_AUTH_JSON
          valueFrom:
            secretKeyRef:
              name: pi-agent-openai-codex
              key: auth.json
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
      # SYS_ADMIN and an unconfined seccomp profile are isolated in this
      # fixed-protocol helper; Bubblewrap does not bind pod credential paths,
      # while the Pi/model container retains no elevated capability.
      extraContainers:
        - name: bash-sandbox
          image: docker.io/narumi/kagent-pi-example@sha256:a52f5466e4d9f888b8b9f13f6da41af66efc84c2a62cfbc466f033678d36482d
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/node"]
          args: ["/app/dist/src/sandbox-server.js"]
          env:
            - name: PI_WORKSPACE_DIR
              value: /workspace
            - name: PI_BASH_SANDBOX_SOCKET
              value: /run/pi-sandbox/sandbox.sock
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: Unconfined
            capabilities:
              drop: ["ALL"]
              add: ["SYS_ADMIN"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: sandbox-socket
              mountPath: /run/pi-sandbox
            - name: tmp
              mountPath: /tmp
      volumeMounts:
        - name: data
          mountPath: /data
        - name: workspace
          mountPath: /workspace
        - name: tmp
          mountPath: /tmp
        - name: sandbox-socket
          mountPath: /run/pi-sandbox
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pi-agent-data
        - name: workspace
          persistentVolumeClaim:
            claimName: pi-agent-workspace
        - name: tmp
          emptyDir: {}
        - name: sandbox-socket
          emptyDir: {}
  sandbox:
    network:
      allowedDomains:
        - chatgpt.com
        - auth.openai.com
